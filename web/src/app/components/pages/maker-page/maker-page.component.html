<nav class="breadcrumbs" aria-label="Хлебные крошки">
  <a routerLink="/home-page">Главная</a>
  <span>/</span>
  <span>Каталог</span>
  <span>/</span>
  <span>Производители</span>
</nav>

<div class="page-head">
  <h1>
    Производители
    <span class="count">{{ list.visibleCount() }}</span>
  </h1>

  <div class="actions" role="group" aria-label="Фильтры">
    <button class="pill" [class.is-active]="region() === 'all'" (click)="region.set('all')">Все страны</button>
    <button class="pill" [class.is-active]="region() === 'europe'" (click)="region.set('europe')">Европа</button>
    <button class="pill" [class.is-active]="region() === 'asia'" (click)="region.set('asia')">Азия</button>
    <button class="pill" [class.is-active]="region() === 'usa'" (click)="region.set('usa')">США</button>
    <button class="pill" [class.is-active]="sort() !== 'name'" (click)="toggleSort()">
      {{ sortLabel() }}
    </button>
  </div>
</div>

<app-maker-list #list [region]="region()" [sort]="sort()" />
